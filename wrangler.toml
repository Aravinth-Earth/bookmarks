# Bookmarks — a sealed vault served on the public site's own origin.
#
# The page and the API share one prefix, and the Worker answers both, so the security headers
# cannot be bypassed by fetching a static file directly. Same shape as /w/expense-splitter/.
name = "bookmarks"
main = "src/index.js"
compatibility_date = "2026-10-30"

[vars]
# One account while the service is being tested. The Registry enforces it and answers
# 429 {error:"full"} at the cap; raise it to open creation to others.
MAX_ACCOUNTS = "1"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# A missing page has to link back to whichever prefix served it.
not_found_handling = "none"
# Assets would otherwise be served before the Worker, and the page would lose the CSP/HSTS
# headers the rest of the site sets.
run_worker_first = true

# One Durable Object per account: the nonce, the session, the sealed vault and its last three
# versions. SQLite-backed, matching the other app on this zone.
[[durable_objects.bindings]]
name = "VAULTS"
class_name = "Vault"

# One instance that caps how many accounts may exist, so open creation cannot fill the account
# with free storage. The same job it does for splitter's rooms.
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

# Per-source request limits. Each binding counts calls per key inside the Cloudflare location
# that serves the request; the Worker passes a digest of the caller's address, never the address.
# The thresholds are the ones `LIMITS` in src/index.js holds, and scripts/check.mjs refuses a
# deploy where the two disagree. A request over its class's ceiling is answered 429
# {"error":"rate_limited"} before it reaches storage or an outbound fetch.
#
# Sign-in: /account, /challenge, /login — 10 per minute per source.
[[ratelimits]]
name = "SIGNIN_LIMIT"
namespace_id = "3101"

  [ratelimits.simple]
  limit = 10
  period = 60

# Icon and title: /icon, /title — 30 per ten seconds per source.
[[ratelimits]]
name = "FETCH_LIMIT"
namespace_id = "3102"

  [ratelimits.simple]
  limit = 30
  period = 10

# Vault: /vault, /sessions, /logout — 60 per minute per source.
[[ratelimits]]
name = "VAULT_LIMIT"
namespace_id = "3103"

  [ratelimits.simple]
  limit = 60
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Vault"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registry"]

# The app's own origin. IndexedDB belongs to a host, not a path, so serving the app here keeps
# its remembered key out of reach of every other page on www.
[[routes]]
pattern = "b.332321.xyz/*"
zone_name = "332321.xyz"

[[routes]]
pattern = "b.332321.xyz"
zone_name = "332321.xyz"

[[routes]]
pattern = "www.332321.xyz/w/bookmarks/*"
zone_name = "332321.xyz"

# A wildcard route does not match the slash-less path, so the bare canonical path needs its own.
[[routes]]
pattern = "www.332321.xyz/w/bookmarks"
zone_name = "332321.xyz"

# Workers Builds runs `npx wrangler preview` for every branch push, and that command refuses to
# run without this block -- an empty one is enough.
[previews]

# A Preview gets its own object namespace, so a branch can exercise sync without touching the
# data production holds.
[[previews.durable_objects.bindings]]
name = "VAULTS"
class_name = "Vault"

[[previews.durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[observability]
enabled = true
